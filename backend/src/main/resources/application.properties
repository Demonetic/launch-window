spring.application.name=launch-window-backend

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.http.clients.connect-timeout=${HTTP_CLIENT_CONNECT_TIMEOUT:3s}
spring.http.clients.read-timeout=${HTTP_CLIENT_READ_TIMEOUT:10s}

launch-library.base-url=${LAUNCH_LIBRARY_BASE_URL:https://lldev.thespacedevs.com/2.3.0}
launch-library.page-size=${LAUNCH_LIBRARY_PAGE_SIZE:10}
launch-library.sync.enabled=${LAUNCH_SYNC_ENABLED:false}
launch-library.sync.interval=${LAUNCH_SYNC_INTERVAL:PT30M}
launch-library.sync.initial-delay=${LAUNCH_SYNC_INITIAL_DELAY:PT10S}
launch-library.max-pages=${LAUNCH_LIBRARY_MAX_PAGES:20}
launch-library.max-launches=${LAUNCH_LIBRARY_MAX_LAUNCHES:200}

open-meteo.base-url=${OPEN_METEO_BASE_URL:https://api.open-meteo.com/v1}
open-meteo.forecast-days=${OPEN_METEO_FORECAST_DAYS:16}
open-meteo.sync.enabled=${WEATHER_SYNC_ENABLED:false}
open-meteo.sync.interval=${WEATHER_SYNC_INTERVAL:PT3H}
open-meteo.sync.initial-delay=${WEATHER_SYNC_INITIAL_DELAY:PT30S}

security.jwt.secret=${JWT_SECRET}
security.jwt.issuer=${JWT_ISSUER:launch-window}
security.jwt.expiration=${JWT_EXPIRATION:PT2H}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.operations-sorter=method

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.password-reset.frontend-base-url=${PASSWORD_RESET_FRONTEND_URL:http://localhost:5173}
app.password-reset.expiration=${PASSWORD_RESET_EXPIRATION:PT30M}
app.password-reset.request-cooldown=${PASSWORD_RESET_REQUEST_COOLDOWN:PT1M}
app.password-reset.from-email=${MAIL_FROM:no-reply@launch-window.local}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.mail.enabled=false